[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "argusloom"
version = "0.1.0"
description = "Interactive Knowledge Graph for Dynamic Threat Modeling"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.7.0",
  "typer>=0.12.0",
  "structlog>=24.4.0",
  "networkx>=3.3.0",
  "python-hcl2>=7.0.0",
  "PyYAML>=6.0.2",
  "chromadb>=0.5.18",
  "sentence-transformers>=3.3.0",
  "httpx>=0.27.0",
  "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "black>=24.8.0",
  "ruff>=0.7.0",
  "pytest-cov>=5.0.0",
]

[project.scripts]
argusloom = "argusloom.cli:app"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
